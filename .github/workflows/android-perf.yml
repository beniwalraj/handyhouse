name: Android perf (Flashlight)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  android-flashlight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate native project and build Release APK
        run: |
          npx expo prebuild --platform android
          cd android && ./gradlew assembleRelease

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Flashlight on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-perf.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashlight-results
          path: flashlight-results.json
