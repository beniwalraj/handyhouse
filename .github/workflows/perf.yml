name: iOS smoke flows (Maestro)

on:
  workflow_dispatch:        # manual only; macOS minutes are expensive on private repos

jobs:
  ios-maestro:
    runs-on: macos-latest   # iOS simulators only run on macOS runners
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate native project and build Release for simulator
        run: |
          npx expo prebuild --platform ios
          # Xcode 26 workaround: fmt 11.0.2 fails to compile with consteval
          sed -i '' 's/\(define FMT_USE_CONSTEVAL\) 1/\1 0/' ios/Pods/fmt/include/fmt/base.h
          xcodebuild \
            -workspace ios/Handyhouse.xcworkspace \
            -scheme Handyhouse \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator and install app
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Handyhouse.app

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run functional flows
        run: maestro test maestro/ --include-tags=functional --format junit --output maestro-report.xml

      - name: Copy Maestro debug files (screenshots, logs)
        if: always()
        run: cp -r "$HOME/.maestro/tests" maestro-debug || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            maestro-debug
